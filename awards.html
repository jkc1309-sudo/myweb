          <h1>获奖作品</h1>
          <p class="lead">红点、移动应用创新赛、吉利吉先锋与 A Design 等获奖作品。</p>
        </section>

        <section class="section reveal">
                    <div class="award-showcase reveal" data-award-carousel>
            <div class="award-stage">
              <button class="award-nav award-nav--prev" type="button" aria-label="上一件作品">‹</button>
              <div class="award-track">
                <button
                  class="award-card"
                  type="button"
                  data-award-index="0"
                  data-award-kicker="2026 红点设计奖"
                  data-award-title="ScrollDesk"
                  data-award-body="ScrollDesk 是一款以柔性卷轴屏重构办公桌的自适应数字工作站，旨在探索未来办公场景中屏幕、桌面与身体姿态之间更加自然的交互关系。"
                >
                  <img src="assets/award-scrolldesk.jpg" alt="ScrollDesk 柔性卷轴屏数字工作站" />
                </button>
                <button
                  class="award-card"
                  type="button"
                  data-award-index="1"
                  data-award-kicker="2026 中国移动应用创新大赛"
                  data-award-title="MusePlanet 智绘星球"
                  data-award-body="从观看文物到临摹再创作，基于传统文物的儿童个性化创新创作应用。"
                >
                  <img src="assets/award-museplanet.jpg" alt="MusePlanet 智绘星球多屏界面" />
                </button>
                <button
                  class="award-card"
                  type="button"
                  data-award-index="2"
                  data-award-kicker="吉利吉先锋创新创业大赛冠军"
                  data-award-title="P Car"
                  data-award-body="聚焦户外露营人群，适合越野、露营等户外活动。设有独立的宠物乘坐空间和宠物物品存放，车内休息与社交更舒适，可交互车窗记录旅途中的风景。"
                >
                  <img src="assets/award-pcar.jpg" alt="吉利 P Car 户外露营概念车" />
                </button>
                <button
                  class="award-card"
                  type="button"
                  data-award-index="3"
                  data-award-kicker="A Design Award Iron Prize"
                  data-award-title="PolyBeat"
                  data-award-body="PolyBeat 面向儿童，用有趣、可交互的方式帮助他们学习乐理。几何多边形与音乐节奏有很强的对应关系，可以把节奏声音可视化，帮助儿童理解音乐风格与鼓点节奏型之间的关系，并掌握节奏型。"
                >
                  <img src="assets/award-polybeat.jpg" alt="PolyBeat 儿童乐理实体交互玩具" />
                </button>
              </div>
              <button class="award-nav award-nav--next" type="button" aria-label="下一件作品">›</button>
            </div>
            <div class="award-caption" aria-live="polite">
              <p class="section-label" data-award-kicker></p>
              <h3 data-award-title></h3>
              <p data-award-body></p>
            </div>
