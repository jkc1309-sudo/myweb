<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历 | 金可成</title>
    <meta
      name="description"
      content="金可成的中英文简历预览与下载。浙江大学人机交互博士生，AI 产品经理。"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body data-page="cv" data-nav="cv">
    <div class="site-shell" id="top">
      <header class="site-header">
        <a class="brand" href="index.html">
          <span class="brand-script">Kecheng</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-label="打开导航">
          <span></span>
          <span></span>
        </button>
        <div class="header-end">
          <nav class="site-nav" aria-label="页面导航">
            <a href="index.html#about" data-section="about">简介</a>
            <a href="index.html#projects" data-section="projects">项目</a>
            <a href="index.html#research" data-section="research">研究</a>
            <a href="index.html#honors" data-section="honors">荣誉</a>
            <a href="index.html#contact" data-section="contact">联系</a>
            <a class="nav-cta" href="cv.html" data-section="cv">简历</a>
          </nav>
          <nav class="lang-switch" aria-label="语言">
            <a href="cv.html" aria-current="page">中</a>
            <span aria-hidden="true">/</span>
            <a href="en/cv.html" hreflang="en">EN</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="page-intro reveal">
          <p class="eyebrow">简历</p>
          <h1>预览或下载</h1>
          <p class="lead">同一页可切换中文与英文 PDF，默认显示中文版。</p>
        </section>

        <section class="section reveal">
          <div
            class="cv-viewer"
            data-cv-root
            data-cv-default="zh"
            data-cv-zh="Jin_CV_zh.pdf"
            data-cv-en="Jin_CV.pdf"
          >
            <div class="cv-viewer__toolbar">
              <div class="cv-lang" role="tablist" aria-label="简历语言">
                <button type="button" role="tab" aria-selected="true" data-cv-lang="zh">中文</button>
                <button type="button" role="tab" aria-selected="false" data-cv-lang="en">English</button>
              </div>
              <div class="cv-viewer__actions">
                <a class="button button-primary" data-cv-download href="Jin_CV_zh.pdf" download="Jin_CV_zh.pdf">下载 PDF</a>
                <a class="button button-secondary" data-cv-open href="Jin_CV_zh.pdf" target="_blank" rel="noopener">新标签打开</a>
              </div>
            </div>
            <div class="cv-viewer__frame">
              <iframe data-cv-frame src="Jin_CV_zh.pdf#view=FitH" title="金可成中文简历" loading="lazy"></iframe>
              <noscript>
                <p class="cv-viewer__fallback">
                  浏览器无法内嵌 PDF，请下载
                  <a href="Jin_CV_zh.pdf">中文简历</a>
                  或
                  <a href="Jin_CV.pdf">英文简历</a>。
                </p>
              </noscript>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer rich">
        <div class="footer-bar">
          <p>© 2026 金可成 · Kecheng Jin</p>
          <p>更新于 2026.09</p>
          <a href="#top" class="js-back-to-top">返回顶部 ↑</a>
        </div>
      </footer>
    </div>
    <button class="back-to-top" type="button" aria-label="返回顶部">↑</button>
  </body>
</html>
